name: Genereeri ja avalda tunniplaan

# EduPage ei vota GitHubi runneri IP-ga uhendust vastu: port 443
# laheb timeouti nii IPv4 kui IPv6 peal. Seetottu ei kai paringud
# siit otse, vaid Cloudflare Workeri kaudu, mille IP-le EduPage
# vastab. Vahendaja kood on vahendaja/ all.

on:
  # Generaatori voi tunniplaan.html-i muudatus laheb kohe lehele.
  push:
    branches: [main]

  # Asenduste parast. Cron on UTC, Eesti on suvel UTC+3 ja talvel
  # UTC+2, seega 4-14 UTC katab koolipaeva u 06:00-17:00 kohalikku
  # aega.
  #
  # 5 minutit on GitHubi luhim lubatud intervall. Pagesi 10 ehituse
  # tunnis piir siia ei puutu: see kehtib ainult Pagesi enda ehitusele,
  # mitte oma workflow'ga avaldamisele. Repo on avalik, seega Actionsi
  # minutid on tasuta.
  #
  # NB! Cron on soovitus, mitte lubadus. Mootmine */10 pealt andis
  # mediaani 10.3 min, keskmise 12.0 ja halvimal juhul 20.6 min.
  # Oodata tasub sama hajuvust ka siit: enamasti 5-7 min, vahel rohkem.
  schedule:
    - cron: '*/5 4-14 * * 1-5'

  # Kasitsi: Actions -> see workflow -> Run workflow.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uks avaldamine korraga, pooleliolevat ei katkestata.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  genereeri:
    # Cron jookseb ainult live repos. Forkis (dev) kaivitab genereerimise
    # push ja kasitsi kaivitamine; muidu kysiks kaks repot EduPage'i
    # iga 5 min tagant.
    if: github.event_name != 'schedule' || github.repository == 'Kivioli-Riigikool/tunniplaan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Soltuvusi ei ole, npm installi ei ole vaja. Kui EduPage voi
      # vahendaja ei vasta, kukub siin labi ja eelmine avaldatud
      # versioon jaab lehel alles.
      - name: Genereeri HTML EduPage'ist
        env:
          EDUPAGE_VAHENDAJA: ${{ secrets.EDUPAGE_VAHENDAJA }}
          EDUPAGE_VOTI: ${{ secrets.EDUPAGE_VOTI }}
        run: node edupage-generate.mjs koik

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  avalda:
    needs: genereeri
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
